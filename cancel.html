<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Canceled</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50 text-gray-800 flex flex-col items-center justify-center min-h-screen">

  <div class="bg-white p-10 rounded-xl shadow-lg text-center max-w-lg">
    <h1 class="text-4xl font-bold text-red-600 mb-4" data-i18n="cancel_title">❌ Payment Canceled</h1>
    <p class="text-lg mb-6" data-i18n="cancel_msg">Your payment was not completed. Please try again.</p>
    <a href="/" class="bg-red-600 text-white px-6 py-3 rounded-lg font-semibold" data-i18n="back_home">🏠 Back to Home</a>
  </div>

  <!-- Локализация -->
  <script>
    const TEXTS = {
      "RU": {
        cancel_title: "❌ Оплата отменена",
        cancel_msg: "Ваша оплата не была завершена. Попробуйте снова.",
        back_home: "🏠 На главную"
      },
      "EN": {
        cancel_title: "❌ Payment Canceled",
        cancel_msg: "Your payment was not completed. Please try again.",
        back_home: "🏠 Back to Home"
      }
    };

    function switchLang(lang) {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerText = TEXTS[lang][key];
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("lang") || "EN";
      switchLang(savedLang);
    });
  </script>
</body>
</html>
