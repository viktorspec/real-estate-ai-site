<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Canceled</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

  <div class="bg-white shadow-lg rounded-lg p-8 text-center max-w-md">
    <h1 class="text-3xl font-bold text-red-600 mb-4" data-i18n="cancel_title">❌ Payment Canceled</h1>
    <p class="text-gray-700 mb-6" data-i18n="cancel_msg">Your payment was canceled. You can try again anytime.</p>
    <a href="/index.html" class="bg-blue-600 text-white px-6 py-2 rounded" data-i18n="cancel_back">⬅️ Back to Home</a>
  </div>

  <!-- Локализация -->
  <script>
    const TEXTS = {
      "RU": {
        cancel_title: "❌ Оплата отменена",
        cancel_msg: "Ваша оплата была отменена. Вы можете попробовать снова в любое время.",
        cancel_back: "⬅️ Вернуться на главную",
      },
      "EN": {
        cancel_title: "❌ Payment Canceled",
        cancel_msg: "Your payment was canceled. You can try again anytime.",
        cancel_back: "⬅️ Back to Home",
      }
    };

    function switchLang(lang) {
      localStorage.setItem("lang", lang);
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerText = TEXTS[lang][key];
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("lang") || "EN";
      switchLang(savedLang);
    });
  </script>
</body>
</html>
