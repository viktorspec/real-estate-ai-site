<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800 flex flex-col items-center justify-center min-h-screen">

  <div class="bg-white p-10 rounded-xl shadow-lg text-center max-w-lg">
    <h1 class="text-4xl font-bold text-green-600 mb-4" data-i18n="success_title">✅ Payment Successful!</h1>
    <p class="text-lg mb-6" data-i18n="success_msg">Thank you for your purchase. Your license key will be sent to your email.</p>
    <a href="/" class="bg-green-600 text-white px-6 py-3 rounded-lg font-semibold" data-i18n="back_home">🏠 Back to Home</a>
  </div>

  <!-- Локализация -->
  <script>
    const TEXTS = {
      "RU": {
        success_title: "✅ Оплата прошла успешно!",
        success_msg: "Спасибо за покупку. Ваш лицензионный ключ будет отправлен на email.",
        back_home: "🏠 На главную"
      },
      "EN": {
        success_title: "✅ Payment Successful!",
        success_msg: "Thank you for your purchase. Your license key will be sent to your email.",
        back_home: "🏠 Back to Home"
      }
    };

    function switchLang(lang) {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerText = TEXTS[lang][key];
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("lang") || "EN";
      switchLang(savedLang);
    });
  </script>
</body>
</html>
