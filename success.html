<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сообщение отправлено</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #f9fafb, #eef2ff);
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    .check {
      font-size: 70px;
      color: #22c55e;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 15px;
      color: #111827;
    }
    p {
      font-size: 1.1em;
      color: #374151;
      margin-bottom: 30px;
    }
    a {
      display: inline-block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }
    a:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="check">✅</div>
    <h1>Ваше сообщение отправлено!</h1>
    <p>Спасибо за обратную связь. Мы свяжемся с вами в ближайшее время.</p>
    <a href="index.html">⬅ Вернуться на главную</a>
  </div>
</body>
</html>
